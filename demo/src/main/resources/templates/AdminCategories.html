<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías - El Desván</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/GlobalStyle.css">
    <link rel="stylesheet" href="../static/AdminCategories.css">

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="Index.html">
                <strong>El Desván</strong> <span class="badge bg-danger">Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="Index.html">Volver a la tienda</a>
                    <a class="nav-link" href="Admin.html">Panel Admin</a>

                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Gestión de Categorías</h3>
                    <a href="Admin.html" class="btn btn-outline-secondary btn-sm">← Volver al Panel</a>
                </div>

                <div class="card mb-5 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Crear Nueva Categoría</h5>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre de categoría</label>
                                <input type="text" class="form-control" placeholder="Ej: Calzado">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Categoría</button>
                        </form>
                    </div>
                </div>

                <h5>Lista de Categorías</h5>
                <div class="table-responsive shadow-sm">
                    <table class="table table-bordered table-hover align-middle bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th class="text-center" style="width: 200px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Camisetas</td>
                                <td class="text-center">
                                    <button class="btn btn-warning btn-sm me-1">Editar</button>
                                    <button class="btn btn-danger btn-sm">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
