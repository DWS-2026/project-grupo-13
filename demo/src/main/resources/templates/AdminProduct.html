<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestión de Productos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/GlobalStyle">
  <link rel="stylesheet" href="/Product">
    <link rel="stylesheet" href="/AdminProduct">

  
  <style>
    body { padding-top: 85px; background-color: #f8f9fa; }
    .card-form { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>

<body>
       <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">
                <strong>El Desván</strong> <span class="badge bg-danger">Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/Index">Volver a la tienda</a>
                    <a class="nav-link" href="/Admin">Panel Admin</a>

                </div>
            </div>
        </div>
    </nav>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card-form p-4">
                    <h5 class="mb-3 text-primary">Añadir Nuevo Producto</h5>
                    <form action="/AdminProduct" method="post">

                    <div class="mb-3">
                        <label for="prodNombre" class="form-label">Nombre del Producto</label>
                        <input type="text" id="prodNombre" name="nombre" class="form-control" placeholder="Ej: Zotac RTX5060ti" required>
                    </div>

                    <div class="mb-3">
                        <label for="prodDesc" class="form-label">Descripción</label>
                        <textarea id="prodDesc" name="descripcion" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="prodPrecio" class="form-label">Precio (€)</label>
                            <input type="number" id="prodPrecio" name="precio" class="form-control" step="0.01" required>
                        </div>
                        <div class="col">
                            <label for="prodCat" class="form-label">Categoría</label>
                            <select id="prodCat" name="categoria" class="form-select" required>
                                <option selected disabled>Elegir...</option>
                                <option>Smartphones</option>
                                <option>GPUs</option>
                                <option>Tablets</option>
                                <option>Ordenadores</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="prodImg" class="form-label">URL de Imagen</label>
                        <input type="text" id="prodImg" name="imagen" class="form-control" placeholder="/imagenes/ejemplo.jpg" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Crear Producto</button>
                </form>

                </div>
            </div>

            <div class="col-lg-8">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h5 class="mb-3">Productos Existentes</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Precio</th>
                                    <th>Categoría</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{#productos}}
                                <tr>
                                    <td><strong>{{nombre}}</strong></td>
                                    <td>{{precio}}€</td>
                                    <td><span class="badge bg-info text-dark">{{categoria}}</span></td>
                                    <td class="text-center">
                                        <a href="/AdminProduct/eliminar/{{id}}" class="btn btn-danger btn-sm">Eliminar</a>
                                    </td>
                                </tr>
                                {{/productos}}
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
