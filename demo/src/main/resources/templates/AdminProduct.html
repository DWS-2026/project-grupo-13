<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestión de Productos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/GlobalStyle.css">
  <link rel="stylesheet" href="../static/Product.css">
  
  <style>
    body { padding-top: 85px; background-color: #f8f9fa; }
    .card-form { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand" href="Index.html">El Desván - Admin</a>
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link" href="Index.html">Inicio</a>
                    <a class="nav-link" href="Admin.html">Panel Admin</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Gestión de Productos</h3>
            <a href="Admin.html" class="btn btn-outline-secondary">← Volver al Panel</a>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card-form p-4">
                    <h5 class="mb-3 text-primary">Añadir Nuevo Producto</h5>
                    <form>
                        <div class="mb-3">
                            <label for="prodNombre" class="form-label">Nombre del Producto</label>
                            <input type="text" id="prodNombre" class="form-control" placeholder="Ej: Figura Luffy">
                        </div>

                        <div class="mb-3">
                            <label for="prodDesc" class="form-label">Descripción</label>
                            <textarea id="prodDesc" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label for="prodPrecio" class="form-label">Precio (€)</label>
                                <input type="number" id="prodPrecio" class="form-control" step="0.01">
                            </div>
                            <div class="col">
                                <label for="prodCat" class="form-label">Categoría</label>
                                <select id="prodCat" class="form-select">
                                    <option selected disabled>Elegir...</option>
                                    <option>Camisetas</option>
                                    <option>Figuras</option>
                                    <option>Videojuegos</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Crear Producto</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h5 class="mb-3">Productos Existentes</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Precio</th>
                                    <th>Categoría</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Figura Dragon Ball</strong></td>
                                    <td>49,99€</td>
                                    <td><span class="badge bg-info text-dark">Figuras</span></td>
                                    <td class="text-center">
                                        <button class="btn btn-warning btn-sm">Editar</button>
                                        <button class="btn btn-danger btn-sm">Eliminar</button>
                                    </td>
                                </tr>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
