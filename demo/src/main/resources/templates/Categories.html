<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{categoria}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel ="stylesheet" href="/GlobalStyle.css" >
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/Index">El Desván</a>
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link active" href="/Index">Inicio</a>
                    <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                    <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                    
                    {{^logged}}
                    <a class="nav-link d-flex align-items-center" href="/Login">
                        <img src="/imagenes/agregar-usuario.png" width="20" height="20"
                            style="filter: invert(1);" class="me-2">
                        Iniciar sesión / Registrarse
                    </a>
                    {{/logged}}

                    
                    {{#logged}}
                    <li class="nav-item dropdown ms-lg-2">
                        <a class="nav-link dropdown-toggle btn btn-outline-info" href="#" id="cuentaDropdown"
                        role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Mi cuenta
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="cuentaDropdown">
                            <li><a class="dropdown-item" href="/EditProfile">Editar perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><form action="/logout" method="post" style="display:inline;">
                                <input type="hidden" name="_csrf" value="{{token}}" />
                                <button type="submit" class="dropdown-item text-danger">
                                    Cerrar sesión
                                </button>
                            </form>
                        </li>
                        </ul>
                    </li>
                    {{/logged}}
                    <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                        <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                    </a>
                </div>
            </div>
        </nav>
    </header>
    <br><br>

<div class="container py-5">
    <h1 class="text-center mb-5 fw-bold text-white">{{categoria}}</h1>

    <div class="row g-4">
    {{#productos}}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card category-card h-100 text-center p-3 bg-transparent text-white" style="border: 1px solid rgba(255, 255, 255, 0.15);">
            <a href="/producto/{{id}}" class="text-decoration-none text-white">
                {{#image}}
                    <img 
                    src="/image/{{image.id}}" 
                    class="card-img-top rounded bg-white p-2" 
                    alt="{{nombre}}"
                    />
                    {{/image}}

                    {{^image}}
                    <img 
                    src="/imagenes/default.jpg" 
                    class="card-img-top rounded bg-white p-2" 
                    alt="Sin imagen"
                    />
                {{/image}}

                <div class="card-body pb-0">
                    <h5 class="category-title mt-2">{{nombre}}</h5>
                    <p class="fw-bold text-success">{{precio}} €</p>
                </div>
            </a>
            
            <form action="/agregar-carrito" method="POST" class="mt-3">
                <input type="hidden" name="_csrf" value="{{token}}" />
                <input type="hidden" name="productId" value="{{id}}">
                <button type="submit" class="btn btn-outline-light w-100 fw-bold">Añadir al carrito</button>
            </form>

        </div>
    </div>
    {{/productos}}
    </div>
</div>
</body>
</html>
