<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Categorías</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/imagenes/icono.png" type="image/png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href = "/GlobalStyle.css">
  <link rel="stylesheet" href = "/Categories.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  


</head>

<body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="/Index">El Desván</a>
                    <div class="navbar-nav ms-auto align-items-center">
                        <a class="nav-link active" href="/Index">Inicio</a>
                        <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                        <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                        
                        <!-- BOTÓN LOGIN (solo si NO está logueado) -->
{{^logged}}
<a class="nav-link d-flex align-items-center" href="/Login">
    <img src="/imagenes/agregar-usuario.png" width="20" height="20"
        style="filter: invert(1);" class="me-2">
    Iniciar sesión / Registrarse
</a>
{{/logged}}

<!-- MI CUENTA DROPDOWN (solo si SÍ está logueado) -->
{{#logged}}
<li class="nav-item dropdown ms-lg-2">
    <a class="nav-link dropdown-toggle btn btn-outline-info" href="#" id="cuentaDropdown"
       role="button" data-bs-toggle="dropdown" aria-expanded="false">
        Mi cuenta
    </a>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="cuentaDropdown">
        <li><a class="dropdown-item" href="/EditProfile">Editar perfil</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="/logout">Cerrar sesión</a></li>
    </ul>
</li>
{{/logged}}
                      <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                            <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                        </a>
                    </div>
                </div>
            </nav>
        </header>

<div class="container py-5">
  <br><h1 class="text-center mb-5 fw-bold">Categorías</h1>
        

  <div class="row g-4">

    <!-- Categoría -->
    {{#categorias}}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <a href="/categoria/{{name}}" class="text-decoration-none">
        <div class="card category-card h-100 text-center p-3">
          {{#image}}
            <img src="/image/{{id}}" class="card-img-top rounded" alt="{{name}}">
          {{/image}}
          <div class="card-body">
            <h5 class="category-title">{{name}}</h5>
          </div>
        </div>
      </a>
    </div>
    {{/categorias}}


  </div>
</div>

</body>

</html>
