<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - El desván del friki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/GlobalStyle">
    <link rel="stylesheet" href="/EditProfile">
    <link rel="stylesheet" href="/ChangePassword">
    
</head>
<body id="inicio" style="background-color: #f8f9fa;"> <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/Index">El Desván</a>
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link active" href="/Index">Inicio</a>
                    <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                    <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                    <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                    <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                        <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container" style="margin-top: 120px;">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-5">
                <div class="card p-4">

                    <h2 class="text-center mb-4 fw-bold" style="color: #333;">Cambiar Contraseña</h2>
                    
                    {{#errorPassword}}
                    <div class="error-container">
                        <div class="error-icon"></div>
                        <div class="error-text">
                            <p>La contraseña actual no es correcta. Inténtalo de nuevo.</p>
                        </div>
                    </div>
                    {{/errorPassword}}

                    <form action="/ChangePassword" method="post">
                        <input type="hidden" name="_csrf" value="{{token}}">

                        <div class="mb-3">
                            <label for="oldPassword" class="form-label fw-semibold" style="color: #555;">Contraseña Actual</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold" style="color: #555;">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-info text-white fw-bold py-2 shadow-sm">
                                Guardar Contraseña
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer_principal text-center mt-5" style="color: #999;">
        <p>© 2026 El desván del friki</p>
    </footer>

</body>
</html>
