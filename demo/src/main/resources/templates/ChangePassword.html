<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - El desván del friki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/GlobalStyle">
    <link rel="stylesheet" href="/EditProfile">
    
    <style>
        /* Estilos ajustados a la estética blanca de tu tarjeta */
        .error-container {
            display: flex;
            align-items: center;
            background-color: #fdf2f2; /* Fondo rosa muy suave */
            border: 1px solid #f8b4b4; /* Borde rojo suave */
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .error-icon {
            width: 20px;
            height: 20px;
            background-color: #e11d48; /* Rojo vivo para el círculo */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
        }

        /* El símbolo "-" blanco */
        .error-icon::after {
            content: "";
            width: 10px;
            height: 2px;
            background-color: white;
            display: block;
        }

        .error-text {
            color: #9b1c1c; /* Texto rojo oscuro para que se lea bien sobre el rosa */
            font-size: 14px;
            font-weight: 500;
        }

        .error-text p {
            margin: 0;
        }

        /* Ajustes para mantener la tarjeta blanca impecable */
        .card { 
            border-radius: 12px; 
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
        }
        
        .btn-info {
            background-color: #00d1ff; /* El color azul turquesa de tu captura */
            border: none;
        }

        .btn-info:hover {
            background-color: #00b8e6;
        }
    </style>
</head>
<body id="inicio" style="background-color: #f8f9fa;"> <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/Index">El Desván</a>
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link active" href="/Index">Inicio</a>
                    <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                    <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                    <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                    <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                        <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container" style="margin-top: 120px;">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-5">
                <div class="card p-4">

                    <h2 class="text-center mb-4 fw-bold" style="color: #333;">Cambiar Contraseña</h2>
                    
                    {{#errorPassword}}
                    <div class="error-container">
                        <div class="error-icon"></div>
                        <div class="error-text">
                            <p>La contraseña actual no es correcta. Inténtalo de nuevo.</p>
                        </div>
                    </div>
                    {{/errorPassword}}

                    <form action="/ChangePassword" method="post">
                        <input type="hidden" name="_csrf" value="{{token}}">

                        <div class="mb-3">
                            <label for="oldPassword" class="form-label fw-semibold" style="color: #555;">Contraseña Actual</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold" style="color: #555;">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-info text-white fw-bold py-2 shadow-sm">
                                Guardar Contraseña
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer_principal text-center mt-5" style="color: #999;">
        <p>© 2026 El desván del friki</p>
    </footer>

</body>
</html>
