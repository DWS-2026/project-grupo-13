<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías - El Desván</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/GlobalStyle">
    <link rel="stylesheet" href="/AdminCategories">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">
                <strong>El Desván</strong> <span class="badge bg-danger">Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/Index">Volver a la tienda</a>
                    <a class="nav-link" href="/Admin">Panel Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            
                <div class="card mb-5 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Editar Categoría</h5>
                        
                        {{#error}}
                        <div class="alert alert-danger" role="alert">
                            {{error}}
                        </div>
                        {{/error}}

                        <form action="/AdminCategories/Edit/{{category.id}}" method="post" enctype="multipart/form-data">

                            <input type="hidden" name="_csrf" value="{{token}}">
                            
                            <div class="mb-3">
                                <label for="inputNombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="inputNombre" name="name" value="{{category.name}}">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Imagen de la categoría</label>
                                <input type="file" name="image" class="form-control" accept="image/*" >
                            </div>
                            

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success w-100">Guardar Cambios</button>
                                <a href="/AdminCategories" class="btn btn-outline-secondary">Cancelar</a>
                            </div>

                         </form>
                    </div>
                </div>

                
                
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
