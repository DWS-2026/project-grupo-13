<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - El Desván del Friki</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="/GlobalStyle">
     <link rel="stylesheet" href="/Error">
     <style>
                body {
            background-color: #0f172a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        

        .error-title {
            font-size: 2.4rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .error-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .btn-desvan {
            background-color: #ff4d4d;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            transition: 0.2s;
        }

        .btn-desvan:hover {
            background-color: #138496;
            color: white;
        }
     </style>


</head>
<body>

    <div class="error-container">
        <div class="error-title">Ha ocurrido un error</div>
        <p class="error-text">
            Algo ha salido mal, vuelve al inicio<br>
        </p>

        <a href="/Index" class="btn btn-desvan">Volver al inicio</a>
    </div>

</body>
</html>
