<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Categorías</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel ="stylesheet" href="/GlobalStyle.css" >
</head>

<body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="/Index">El Desván</a>
                    <div class="navbar-nav ms-auto align-items-center">
                        <a class="nav-link active" href="/Index">Inicio</a>
                        <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                        <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                        
                        <a class="nav-link d-flex align-items-center" href="/Login">
                            <img src="/imagenes/agregar-usuario.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                            <span>Iniciar sesión / Registrarse</span>
                        </a>
                        
                        <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile" target="_blank">Mi cuenta</a>
                      <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                            <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                        </a>
                    </div>
                </div>
            </nav>
        </header>
        <br><br>

<div class="container py-5">
  <h1 class="text-center mb-5 fw-bold">Smartphones</h1>
        

  <div class="row g-4">

      {{#productos}}
  <div class="col-12 col-sm-6 col-md-4 col-lg-3">
    <a href="/Product/{{nombre}}" class="text-decoration-none">
      <div class="card category-card h-100 text-center p-3">
        <img src="{{imagen}}" class="card-img-top rounded" alt="{{nombre}}">
        <div class="card-body">
          <h5 class="category-title">{{nombre}}</h5>
        </div>
      </div>
    </a>
  </div>
  {{/productos}}


  </div>
</div>

</body>

</html>
