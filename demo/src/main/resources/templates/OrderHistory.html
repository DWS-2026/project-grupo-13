<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El desván del friki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/GlobalStyle.css">
    <link rel="stylesheet" href="/orderHistory.css">
</head>

<body id="inicio">

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">El Desván</a>

            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link active" href="/Index">Inicio</a>
                <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                    <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                </a>
            </div>
        </div>
    </nav>
</header>

<main class="container" style="margin-top: 100px; max-width: 900px;">

    <h1 class="text-center mb-4">Tus pedidos</h1>

    {{#pedidos}}
    <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">Pedido #{{id}}</h5>
                <p class="mb-1">Fecha: {{fecha}}</p>

                <p class="mb-1">Total: {{total}} €</p>


                <span class="badge bg-success">Completado</span>
            </div>

            <a href="/pedido/{{id}}" class="btn btn-primary">Ver pedido</a>
        </div>
    </div>
    {{/pedidos}}

    {{^pedidos}}
    <div class="alert alert-dark text-center border-secondary text-white bg-dark">
        No tienes pedidos todavía.
    </div>
    {{/pedidos}}

</main>

<footer class="footer_principal">
    <p>© 2026 El desván del friki</p>
</footer>

</body>
</html>
