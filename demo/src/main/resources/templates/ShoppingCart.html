<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/GlobalStyle.css">
  <link rel="stylesheet" href="/ShoppingCart.css">
</head>

<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">El Desván</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link active" href="/Index">Inicio</a>
                <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                
                <a class="nav-link d-flex align-items-center" href="/Login">
                    <img src="/imagenes/agregar-usuario.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                    <span>Iniciar sesión / Registrarse</span>
                </a>
                
                <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                    <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                </a>
            </div>
        </div>
    </nav>
</header>
<br><br>

<div class="container py-5">
  <h1 class="text-center mb-5 fw-bold text-white">Carrito de Compras</h1>

  <div class="row g-3" id="contenedor-carrito">
      <p class="text-center text-white" id="mensaje-carga">Cargando tu carrito...</p>
  </div> 

  <div class="d-flex justify-content-end mt-4">
      <div class="text-end text-white">
          <h4>Total de artículos: <span class="fw-bold text-primary" id="total-articulos">0</span></h4>
          <button class="btn btn-success btn-lg mt-2">Proceder al Pago</button>
      </div>
  </div>

  <footer class="footer_principal mt-5 text-center text-white">
      <p>© 2026 El desván del friki</p>
  </footer>
</div>

<script>
    // Función para cargar los productos (la llamamos al empezar y al borrar)
    function cargarCarrito() {
        fetch('/api/carrito')
            .then(response => response.json())
            .then(productos => {
                const contenedor = document.getElementById('contenedor-carrito');
                const totalArticulos = document.getElementById('total-articulos');
                
                contenedor.innerHTML = '';
                totalArticulos.textContent = productos.length;

                if(productos.length === 0) {
                    contenedor.innerHTML = '<div class="col-12"><div class="alert alert-dark text-center border-secondary text-white bg-dark">Tu carrito está vacío.</div></div>';
                    return;
                }

                productos.forEach(producto => {
                    const tarjetaHTML = `
                    <div class="col-12">
                      <div class="card shadow-sm bg-dark border-secondary">
                        <div class="row g-0 align-items-center">
                          <div class="col-3 col-md-2 p-2 text-center">
                            <img src="${producto.imagen}" class="img-fluid rounded object-fit-contain bg-white" style="height: 80px; width: 100%; padding: 5px;" alt="${producto.nombre}">
                          </div>
                          <div class="col-9 col-md-10">
                            <div class="card-body d-flex justify-content-between align-items-center">
                              <div>
                                <h5 class="card-title mb-1 text-white">${producto.nombre}</h5>
                              </div>
                              <div class="text-end">
                                <span class="d-block fw-bold fs-6 text-success mb-2">✓ Añadido</span>
                                <button onclick="eliminarDelCarrito('${producto.nombre}')" class="btn btn-link text-danger p-0 small text-decoration-none">Eliminar</button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', tarjetaHTML);
                });
            });
    }

    // Función para conectar con Java y borrar el producto
    function eliminarDelCarrito(nombre) {
        const formData = new URLSearchParams();
        formData.append('nombre', nombre);

        fetch('/eliminar-producto', {
            method: 'POST',
            body: formData
        })
        .then(() => {
            // Una vez borrado en Java, volvemos a cargar la lista visualmente
            cargarCarrito();
        })
        .catch(error => console.error('Error al eliminar:', error));
    }

    // Iniciar la carga al abrir la página
    cargarCarrito();
</script>
</body>
</html>
