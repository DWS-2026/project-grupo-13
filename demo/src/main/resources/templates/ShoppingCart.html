<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito - El Desván</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/GlobalStyle.css">
  <link rel="stylesheet" href="/ShoppingCart.css">
</head>

<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">El Desván</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link active" href="/Index">Inicio</a>
                <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                    <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                </a>
            </div>
        </div>
    </nav>
</header>

<br><br><br>

<div class="container py-5">
  <h1 class="text-center mb-5 fw-bold text-white">Carrito de Compras</h1>

  {{#carrito}}
  <div class="card shadow-sm bg-dark border-secondary mb-3">
    <div class="row g-0 align-items-center">
      <div class="col-3 col-md-2 p-2 text-center">
        <img src="{{imagen}}" class="img-fluid rounded bg-white" style="height: 80px; width: 100%; object-fit: contain; padding: 5px;" alt="{{nombre}}">
      </div>

      <div class="col-6 col-md-7">
        <div class="card-body">
          <h5 class="card-title mb-1 text-white">{{nombre}}</h5>

          <form action="/eliminar-producto" method="post" class="mt-2">
            <input type="hidden" name="nombre" value="{{nombre}}">
            <input type="hidden" name="_csrf" value="{{token}}">
            <button class="btn btn-link text-danger p-0 small text-decoration-none">Eliminar</button>
          </form>
        </div>
      </div>

      <div class="col-3 col-md-3 text-end pe-4">
        <h4 class="text-success mb-0 fw-bold">{{precio}}€</h4>
      </div>
    </div>
  </div>
  {{/carrito}}

  {{^carrito}}
  <div class="alert alert-dark text-center border-secondary text-white bg-dark">
    Tu carrito está vacío.
  </div>
  {{/carrito}}

  <div class="d-flex justify-content-end mt-4 text-white">
    <div class="text-end">
      <h4>Total de artículos: <span class="fw-bold text-primary">{{totalArticulos}}</span></h4>
      <h3 class="mt-2">Total a pagar: <span class="fw-bold text-success">{{total}}</span>€</h3>

      <form action="/pagar" method="post">
        <input type="hidden" name="_csrf" value="{{token}}">
        <button class="btn btn-success btn-lg mt-3">Proceder al Pago</button>
      </form>
    </div>
  </div>

  <footer class="footer_principal mt-5 text-center text-white">
      <p>© 2026 El desván del friki</p>
  </footer>
</div>

</body>
</html>
