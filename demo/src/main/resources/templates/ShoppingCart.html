<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito - El Desván</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/GlobalStyle.css">
  <link rel="stylesheet" href="/ShoppingCart.css">
</head>

<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/Index">El Desván</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link active" href="/Index">Inicio</a>
                <a class="nav-link" href="/CategoriesScreen">Categorías</a>
                <a class="nav-link" href="/PromotionsScreen">Ofertas</a>
                <a class="nav-link btn btn-outline-info ms-lg-2" href="/EditProfile">Mi cuenta</a>
                <a class="nav-link d-flex align-items-center" href="/ShoppingCart">
                    <img src="/imagenes/carrito.png" width="20" height="20" style="filter: invert(1);" class="me-2">
                </a>
            </div>
        </div>
    </nav>
</header>
<br><br>

<div class="container py-5">
  <h1 class="text-center mb-5 fw-bold text-white">Carrito de Compras</h1>

  <input type="hidden" id="csrf-token" name="_csrf" value="{{token}}">

  <div class="row g-3" id="contenedor-carrito">
      <p class="text-center text-white" id="mensaje-carga">Cargando tu carrito...</p>
  </div> 

  <div class="d-flex justify-content-end mt-4">
      <div class="text-end text-white">
          <h4>Total de artículos: <span class="fw-bold text-primary" id="total-articulos">0</span></h4>
          <h3 class="mt-2">Total a pagar: <span class="fw-bold text-success" id="precio-total">0.00</span>€</h3>
          <button class="btn btn-success btn-lg mt-3">Proceder al Pago</button>
      </div>
  </div>

  <footer class="footer_principal mt-5 text-center text-white">
      <p>© 2026 El desván del friki</p>
  </footer>
</div>

<script>
    function cargarCarrito() {
        fetch('/api/carrito')
            .then(response => response.json())
            .then(productos => {
                const contenedor = document.getElementById('contenedor-carrito');
                const totalArticulos = document.getElementById('total-articulos');
                const precioTotal = document.getElementById('precio-total');
                
                contenedor.innerHTML = '';
                let sumaTotal = 0;

                if(productos.length === 0) {
                    contenedor.innerHTML = '<div class="col-12"><div class="alert alert-dark text-center border-secondary text-white bg-dark">Tu carrito está vacío.</div></div>';
                    totalArticulos.textContent = 0;
                    precioTotal.textContent = "0.00";
                    return;
                }

                productos.forEach(producto => {
                    sumaTotal += producto.precio;
                    const tarjetaHTML = `
                    <div class="col-12">
                      <div class="card shadow-sm bg-dark border-secondary">
                        <div class="row g-0 align-items-center">
                          <div class="col-3 col-md-2 p-2 text-center">
                            <img src="${producto.imagen}" class="img-fluid rounded bg-white" style="height: 80px; width: 100%; object-fit: contain; padding: 5px;" alt="${producto.nombre}">
                          </div>
                          <div class="col-6 col-md-7">
                            <div class="card-body">
                              <h5 class="card-title mb-1 text-white">${producto.nombre}</h5>
                              <button onclick="eliminarDelCarrito('${producto.nombre}')" class="btn btn-link text-danger p-0 small text-decoration-none">Eliminar</button>
                            </div>
                          </div>
                          <div class="col-3 col-md-3 text-end pe-4">
                            <h4 class="text-success mb-0 fw-bold">${producto.precio.toFixed(2)}€</h4>
                          </div>
                        </div>
                      </div>
                    </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', tarjetaHTML);
                });

                totalArticulos.textContent = productos.length;
                precioTotal.textContent = sumaTotal.toFixed(2);
            });
    }

    function eliminarDelCarrito(nombre) {
        const formData = new URLSearchParams();
        formData.append('nombre', nombre);
        
        // Intentamos enviar el token si existe en la página
        const token = document.getElementById('csrf-token')?.value;
        if(token) formData.append('_csrf', token);

        fetch('/eliminar-producto', { 
            method: 'POST', 
            body: formData 
        })
        .then(response => {
            if (response.ok) {
                cargarCarrito();
            } else {
                console.error("Error al borrar el producto");
            }
        });
    }

    cargarCarrito();
</script>
</body>
</html>
